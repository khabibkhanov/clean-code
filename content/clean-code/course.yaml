slug: clean-code
title: Clean Code
subtitle: Toza kod - 100 darslik to'liq kurs
description: >-
  Robert Martin, John Ousterhout, Martin Fowler, Kent Beck, Michael Feathers va boshqa
  asosiy manbalar asosida toza kod yozishni noldan arxitekturagacha o'rgatuvchi kurs.
  Har bir qoida "qachon ishlaydi va qachon ishlamaydi" bilan beriladi. Misollar
  TypeScript, Node.js (NestJS), React va Next.js'da.
modules:
  - n: 1
    title: Asoslar va fikrlash tarzi
    lessons:
      - { n: 1, slug: clean-code-nima, title: "Clean code nima: ta'riflar va o'lchov", sources: [cc1, cc2, aposd, refactoring] }
      - { n: 2, slug: kod-oqish-narxi, title: "Kodni o'qish narxi va kognitiv yuk", sources: [cc1, aposd, code-complete] }
      - { n: 3, slug: murakkablik, title: "Murakkablik: belgilari va sabablari", sources: [aposd, code-complete] }
      - { n: 4, slug: texnik-qarz, title: "Texnik qarz va sifatning iqtisodiyoti", sources: [cunningham-1992, fowler-debt-quadrant, fowler-quality-cost] }
      - { n: 5, slug: strategik-dasturlash, title: "Strategik va taktik dasturlash", sources: [aposd, pragprog] }
      - { n: 6, slug: boy-scout-qoidasi, title: "Boy Scout qoidasi va kichik yaxshilanishlar", sources: [cc1, tidy-first, pragprog] }
      - { n: 7, slug: simple-design, title: "Kent Beckning oddiy dizayn qoidalari", sources: [fowler-beck-design-rules, cc1, cc2] }
      - { n: 8, slug: dry-togri-tushunish, title: "DRY to'g'ri tushunilishi va noto'g'ri abstraksiya", sources: [pragprog, metz-wrong-abstraction, dodds-aha, abramov-goodbye-clean] }
      - { n: 9, slug: kiss-yagni, title: "KISS va YAGNI: spekulyativ umumiylikdan qochish", sources: [fowler-yagni, pragprog, refactoring] }
      - { n: 10, slug: tanqid-va-bahs, title: "Clean Code tanqidi: dogmadan qochish", sources: [aposd-vs-cc, qntm-clean, muratori-performance, abramov-goodbye-clean] }
